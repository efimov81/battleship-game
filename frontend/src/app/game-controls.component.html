<div class="flex flex-wrap items-end gap-3 rounded-xl border border-line bg-panel px-4 py-3 sm:px-5">
  <label class="grid min-w-32 flex-1 gap-1.5 text-xs font-semibold text-muted sm:flex-none">
    Сложность
    <select #difficulty class="min-h-10 w-full appearance-auto rounded-md border border-line bg-deep px-3 text-sm font-medium text-game-text sm:min-w-36"
      [value]="selectedBotId()" (change)="selectedBotIdChange.emit(difficulty.value)" [disabled]="bots().length === 0">
      @for (bot of bots(); track bot.id) {
        <option [value]="bot.id">{{ bot.label }}</option>
      }
    </select>
  </label>
  @if (phase() !== 'finished') {
    <button type="button" class="game-button flex-1 sm:flex-none"
      [class.button-primary]="!phase()"
      (click)="newGame.emit()" [disabled]="loading() || bots().length === 0">Новая игра</button>
  }
  @if (phase() === 'setup') {
    <div class="flex w-full flex-wrap gap-2 sm:ml-auto sm:w-auto">
      <button type="button" class="game-button flex-1 sm:flex-none"
        (click)="randomize.emit()" [disabled]="loading()">Расставить флот</button>
      <button type="button" class="game-button button-primary flex-1 sm:flex-none"
        (click)="start.emit()" [disabled]="loading()">Начать бой</button>
    </div>
  }
</div>
